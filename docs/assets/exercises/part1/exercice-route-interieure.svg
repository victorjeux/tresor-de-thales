<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img"
  aria-label="Route intérieure : triangle ABD rectangle en A et triangle BCD rectangle en B. AB = 1,5 cm, AD = 6 cm, BC = 12 cm.">
  <rect width="520" height="360" fill="#f7fafc"/>
  <text x="260" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif"
    font-size="16" font-weight="700" fill="#0f3d4f">Route intérieure</text>
  <!--
    Géométrie (échelle ~28 px/cm) :
    A(60, 280), B(60, 238) car AB=1,5 → 42 px, D(228, 280) car AD=6 → 168 px
    BD = (168, -42), longueur √38,25
    Perp unitaire à BD : (42, 168)/√(42²+168²) = (42,168)/√29988
    L = √(42²+168²)=√(1764+28224)=√29988≈173.17
    C = B + 12cm * unit_perp = B + (12*28) * (42,168)/L
    336 * (42/L, 168/L) ≈ 336*(0.2425, 0.9701) ≈ (81.5, 326) trop long en y
    Autre perp : (-42, -168) goes up-left; (42,168) goes down-right; (-168,42)?
    BD=(168,-42). Perp candidates (42,168) and (-42,-168).
    Prefer C to the right-up: use (-(-42), -168) wait.
    Rotate BD 90° CW: (x,y)=(168,-42) → (y, -x)=(-42,-168) up-left
    Rotate 90° CCW: (-y, x)=(42, 168) down-right
    For a map-like figure, place C so DC is readable: use scale for display.
  -->
  <!-- Figure pédagogique lisible (échelle non stricte sur BC pour tenir dans le cadre) -->
  <polygon points="80,290 80,250 260,290" fill="#dceef6" stroke="#1a5f7a" stroke-width="2.5"/>
  <!-- C choisi pour angle droit en B : vecteur BC perpendiculaire à BD -->
  <!-- B(80,250) D(260,290) BD=(180,40). Perp unitaire ~ (-40,180)/√(1600+32400)=(-40,180)/184.4 -->
  <!-- C = B + k*(-40,180) avec k négatif pour aller vers le haut-droit : k*(-(-40)? 
       Perp ( -40, 180) from B goes left-down. Perp (40,-180) goes right-up.
       C = (80,250)+(120,-160) ≈ (200,90) -->
  <polygon points="80,250 220,90 260,290" fill="#f3e8d4" stroke="#1a5f7a" stroke-width="2.5"/>
  <!-- Angle droit en A -->
  <rect x="80" y="274" width="14" height="14" fill="none" stroke="#0f3d4f" stroke-width="2"/>
  <!-- Angle droit en B : petit carré le long de BA (vers le bas) et BC (vers C) -->
  <path d="M80,262 L92,262 L92,250" fill="none" stroke="#0f3d4f" stroke-width="2"/>
  <!-- Sommets -->
  <circle cx="80" cy="290" r="3.5" fill="#0f3d4f"/>
  <circle cx="80" cy="250" r="3.5" fill="#0f3d4f"/>
  <circle cx="220" cy="90" r="3.5" fill="#0f3d4f"/>
  <circle cx="260" cy="290" r="3.5" fill="#0f3d4f"/>
  <text x="60" y="308" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2a32">A</text>
  <text x="58" y="242" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2a32">B</text>
  <text x="228" y="84" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2a32">C</text>
  <text x="268" y="308" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2a32">D</text>
  <!-- Longueurs -->
  <text x="58" y="274" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a5f7a">1,5</text>
  <text x="170" y="308" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a5f7a">6</text>
  <text x="160" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a5f7a">12</text>
  <text x="185" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a1a">BD ?</text>
  <text x="255" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#8a5a1a">DC ?</text>
  <text x="260" y="340" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#4a5a62">ABD rectangle en A · BCD rectangle en B · AB=1,5 · AD=6 · BC=12</text>
</svg>
