<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700">
  <rect width="1080" height="700" fill="#fff8e5"/>
  <text x="540" y="48" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#7a461c">Configuration de Thalès — triangle papillon</text>
  <text x="540" y="88" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" font-weight="700" fill="#2b261f">Deux triangles opposés autour de A (forme en X)</text>

  <!-- Points : M haut-gauche, N bas-gauche, B bas-droite, C haut-droite, A centre -->
  <!-- Triangle AMN (gauche) -->
  <polygon points="250,160 540,350 250,540" fill="#e8be76" fill-opacity="0.55" stroke="none"/>
  <!-- Triangle ABC (droite) -->
  <polygon points="830,540 540,350 830,160" fill="#82b9c3" fill-opacity="0.50" stroke="none"/>

  <!-- Droites sécantes en A : M—A—B et N—A—C -->
  <line x1="250" y1="160" x2="830" y2="540" stroke="#5f401e" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="540" x2="830" y2="160" stroke="#5f401e" stroke-width="8" stroke-linecap="round"/>

  <!-- Parallèles MN et BC -->
  <line x1="250" y1="160" x2="250" y2="540" stroke="#0f829b" stroke-width="8" stroke-linecap="round"/>
  <line x1="830" y1="540" x2="830" y2="160" stroke="#0f829b" stroke-width="8" stroke-linecap="round"/>
  <!-- Marques de parallélisme -->
  <line x1="235" y1="340" x2="265" y2="340" stroke="#0f829b" stroke-width="5"/>
  <line x1="815" y1="340" x2="845" y2="340" stroke="#0f829b" stroke-width="5"/>

  <!-- Points -->
  <circle cx="250" cy="160" r="11" fill="#cb711c" stroke="#412613" stroke-width="2"/>
  <circle cx="250" cy="540" r="11" fill="#cb711c" stroke="#412613" stroke-width="2"/>
  <circle cx="540" cy="350" r="12" fill="#cb711c" stroke="#412613" stroke-width="2"/>
  <circle cx="830" cy="540" r="11" fill="#cb711c" stroke="#412613" stroke-width="2"/>
  <circle cx="830" cy="160" r="11" fill="#cb711c" stroke="#412613" stroke-width="2"/>

  <!-- Noms des points -->
  <text x="215" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#2b261f">M</text>
  <text x="215" y="575" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#2b261f">N</text>
  <text x="540" y="320" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="36" font-weight="700" fill="#2b261f">A</text>
  <text x="870" y="575" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#2b261f">B</text>
  <text x="870" y="150" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="34" font-weight="700" fill="#2b261f">C</text>

  <!-- Libellés des segments -->
  <rect x="320" y="230" width="90" height="32" rx="8" fill="#fff9e9" stroke="#d8b56f"/>
  <text x="365" y="252" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" fill="#2b261f">AM</text>

  <rect x="620" y="430" width="90" height="32" rx="8" fill="#fff9e9" stroke="#d8b56f"/>
  <text x="665" y="452" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" fill="#2b261f">AB</text>

  <rect x="320" y="420" width="90" height="32" rx="8" fill="#fff9e9" stroke="#d8b56f"/>
  <text x="365" y="442" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" fill="#2b261f">AN</text>

  <rect x="620" y="230" width="90" height="32" rx="8" fill="#fff9e9" stroke="#d8b56f"/>
  <text x="665" y="252" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" fill="#2b261f">AC</text>

  <rect x="155" y="335" width="90" height="32" rx="8" fill="#fff9e9" stroke="#d8b56f"/>
  <text x="200" y="357" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" fill="#2b261f">MN</text>

  <rect x="835" y="335" width="90" height="32" rx="8" fill="#fff9e9" stroke="#d8b56f"/>
  <text x="880" y="357" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" fill="#2b261f">BC</text>

  <!-- Légendes triangles -->
  <text x="200" y="640" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#7a461c">Triangle AMN</text>
  <text x="880" y="640" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#0f5f70">Triangle ABC</text>
  <text x="540" y="680" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="20" fill="#2b261f">M, A, B alignés · N, A, C alignés · (MN) // (BC)</text>
</svg>
