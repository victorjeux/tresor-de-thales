  <!-- Bandeau titre -->
  <rect x="120" y="36" width="840" height="62" rx="14" fill="#2e3942" stroke="#b9862f" stroke-width="3"/>
  <rect x="124" y="40" width="832" height="54" rx="11" fill="none" stroke="#15242d" stroke-width="2"/>
  <text x="540" y="74" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="30" fill="#fff7df">Exercice 3 - La charpente du quai</text>

  <!--
    Géométrie (échelle ~40 px/cm, cohérente avec les données) :
    ED = 4,8 ; AE = 5,5 ; AB = 8,25 ; BC = 7,2
    E(260,360) D(260,168) A(480,360) B(810,360) C(810,648)
    A ∈ [BE] et A ∈ [CD] (t = 0,4 sur [DC])
  -->
  <g fill="none" stroke="#155c83" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ED vertical -->
    <line x1="260" y1="168" x2="260" y2="360"/>
    <!-- EB horizontal (E-A-B) -->
    <line x1="260" y1="360" x2="810" y2="360"/>
    <!-- DC diagonal (D-A-C) -->
    <line x1="260" y1="168" x2="810" y2="648"/>
    <!-- BC vertical -->
    <line x1="810" y1="360" x2="810" y2="648"/>
  </g>

  <!-- Codage angle droit en B (entre EB et BC) -->
  <path d="M786 360 L786 384 L810 384" fill="none" stroke="#6b3f1a" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Points -->
  <circle cx="260" cy="168" r="8" fill="#26323a"/>
  <circle cx="260" cy="360" r="8" fill="#26323a"/>
  <circle cx="480" cy="360" r="8" fill="#26323a"/>
  <circle cx="810" cy="360" r="8" fill="#26323a"/>
  <circle cx="810" cy="648" r="8" fill="#26323a"/>

